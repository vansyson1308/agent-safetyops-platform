services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/safetyops.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET, e.g. export JWT_SECRET=$$(openssl rand -hex 32)}
      - NODE_ENV=production
    volumes:
      - db-data:/app/data

volumes:
  db-data:
